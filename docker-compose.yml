version: '3.8'

services:
  backend:
    build:
      context: ./backend
    environment:
      - APP_NAME=StockAI Pulse
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/ml_artifacts:/app/ml_artifacts
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - algoscan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - algoscan-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - algoscan-network

volumes:
  redis_data:

networks:
  algoscan-network:
